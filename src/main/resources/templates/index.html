<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Management</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f9fbfd;
            color: #333;
            margin: 40px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* Style the Add button */
        button {
            background-color: #2ecc71;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #27ae60;
        }

        button a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* Clean up the table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #e0e0e0 !important; /* Overrides the border="1" attribute */
        }

        th {
            background-color: #f4f6f8;
            color: #4a5568;
            font-weight: 600;
            text-align: left;
        }

        /* Keep your exact padding while making it look modern */
        th, td {
            padding: 12px 15px !important; 
            border: 1px solid #e3e8ee !important;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        /* Style the action links inside the table */
        td a {
            text-decoration: none;
            font-weight: 600;
        }

        td a[th\:href*="showFormForUpdate"], td a:not([th\:href])[href*="showFormForUpdate"] {
            color: #3498db;
        }

        td a[th\:href*="deleteStudent"], td a:not([th\:href])[href*="deleteStudent"] {
            color: #e74c3c;
        }

        td a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h2>Student List</h2>

<button><a href="/showNewStudentForm">Add Student</a></button>

<br/><br/>

<table border="1" cellpadding="8">

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Actions</th>
            <th>Delete</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.id}"></td>
            <td th:text="${student.name}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.course}"></td>

            <td>
                <a th:href="@{/showFormForUpdate/{id}(id=${student.id})}">Edit</a>
            </td>
            <td><a th:href="@{/deleteStudent/{id}(id=${student.id})}">Delete</a></td>
        </tr>
    </tbody>

</table>

</body>
</html>
